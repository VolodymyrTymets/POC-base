version: '3.8'

services:
  # Node.js Application (API)
  api:
    build:
      context: ./api
      target: development
    ports:
      - "${API_PORT:-3001}:3001"
    env_file:
      - .env.development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - my_network

  # Background Worker
  worker:
    build:
      context: ./api
      target: worker
    env_file:
      - .env.development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - my_network


  # PostgreSQL Database
  postgres:
    image: postgis/postgis:16-3.4
    restart: always
    env_file:
      - .env.development
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DATABASE_NAME:-poc}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - my_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redisdata:/data
    networks:
      - my_network

  # web/ app (Vite dev server, source live-mounted for HMR)
  web-app:
    build:
      context: ./web
      target: app-dev
    ports:
      - "${WEB_APP_PORT:-5173}:${WEB_APP_PORT:-5173}"
    # WEB_APP_PORT here is the single source of truth for this container's listen
    # port (env vars win over env_file, so it can't diverge from the host mapping
    # above); env_file is for VITE_* vars only (e.g. VITE_GRAPHQL_URL) and is
    # optional since a fresh clone has no local web/packages/app/.env yet.
    environment:
      WEB_APP_PORT: "${WEB_APP_PORT:-5173}"
    env_file:
      - path: web/packages/app/.env
        required: false
    volumes:
      - ./web:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/packages/app/node_modules
      - /usr/src/app/packages/admin/node_modules
      - /usr/src/app/shared/node_modules
    networks:
      - my_network

  # web/ admin (Vite dev server, source live-mounted for HMR)
  web-admin:
    build:
      context: ./web
      target: admin-dev
    ports:
      - "${WEB_ADMIN_PORT:-5174}:${WEB_ADMIN_PORT:-5174}"
    environment:
      WEB_ADMIN_PORT: "${WEB_ADMIN_PORT:-5174}"
    env_file:
      - path: web/packages/admin/.env
        required: false
    volumes:
      - ./web:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/packages/app/node_modules
      - /usr/src/app/packages/admin/node_modules
      - /usr/src/app/shared/node_modules
    networks:
      - my_network


volumes:
  pgdata:
  redisdata:

networks:
  my_network:
    driver: bridge